<!doctype html><html><head><meta charset="utf-8"><title>face audit</title>
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js","three/addons/":"../vendor/addons/"}}</script></head>
<body><pre id="out">running…</pre><script type="module">
// 개발용: 바이크·배달통·헬멧·의상 조합마다 "같은 방향을 보고 1.5mm 이내로 겹치는 삼각형"(지직거림 원인)을 찾아 위치를 출력
// 사용: 로컬 서버에서 tools/face-audit.html?styles=scooter,classic&boxes=basic,camo&helmets=full&outfit=jacket&nat=SG,MY
import * as THREE from 'three';
import * as M from '../js/models.js';
import { nationalLivery } from '../js/themes.js';
const q = new URLSearchParams(location.search);
const out = [];
function trisOf(root) {
  const tris = [];
  root.updateMatrixWorld(true);
  root.traverse((o) => {
    if (!o.isMesh || !o.visible || o.material.transparent) return;
    const g = o.geometry, p = g.attributes.position, idx = g.index;
    const n = idx ? idx.count : p.count;
    const v = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];
    for (let i = 0; i < n; i += 3) {
      for (let k = 0; k < 3; k++) v[k].fromBufferAttribute(p, idx ? idx.getX(i + k) : i + k).applyMatrix4(o.matrixWorld);
      const nrm = new THREE.Vector3().subVectors(v[1], v[0]).cross(new THREE.Vector3().subVectors(v[2], v[0]));
      if (nrm.length() / 2 < 1e-6) continue;
      nrm.normalize();
      tris.push({ a: v[0].clone(), b: v[1].clone(), c: v[2].clone(), n: nrm, d: nrm.dot(v[0]), mesh: o.material.type, id: tris.length });
    }
  });
  return tris;
}
function clip(poly, a, b) {
  const res = [];
  const side = (p) => (b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]);
  for (let i = 0; i < poly.length; i++) {
    const p = poly[i], r = poly[(i + 1) % poly.length], sp = side(p), sr = side(r);
    if (sp >= 0) res.push(p);
    if ((sp >= 0) !== (sr >= 0)) { const t = sp / (sp - sr); res.push([p[0] + (r[0] - p[0]) * t, p[1] + (r[1] - p[1]) * t]); }
  }
  return res;
}
const area2 = (P) => { let s = 0; for (let i = 0; i < P.length; i++) { const a = P[i], b = P[(i + 1) % P.length]; s += a[0] * b[1] - b[0] * a[1]; } return Math.abs(s) / 2; };
function overlap(t1, t2) {
  const n = t1.n, ax = Math.abs(n.x), ay = Math.abs(n.y), az = Math.abs(n.z);
  const pr = ax > ay && ax > az ? (v) => [v.y, v.z] : ay > az ? (v) => [v.x, v.z] : (v) => [v.x, v.y];
  const ccw = (P) => ((P[1][0] - P[0][0]) * (P[2][1] - P[0][1]) - (P[1][1] - P[0][1]) * (P[2][0] - P[0][0]) >= 0 ? P : [P[0], P[2], P[1]]);
  const A = ccw([pr(t1.a), pr(t1.b), pr(t1.c)]), B = ccw([pr(t2.a), pr(t2.b), pr(t2.c)]);
  let poly = A;
  for (let i = 0; i < 3 && poly.length; i++) poly = clip(poly, B[i], B[(i + 1) % 3]);
  return poly.length >= 3 ? area2(poly) : 0;
}
function audit(name, root) {
  const tris = trisOf(root), bins = new Map();
  const key = (t, dd = 0) => `${Math.round(t.n.x * 50)},${Math.round(t.n.y * 50)},${Math.round(t.n.z * 50)},${Math.round(t.d / 0.0015) + dd}`;
  for (const t of tris) { const k = key(t); if (!bins.has(k)) bins.set(k, []); bins.get(k).push(t); }
  const groups = {};
  let hits = 0;
  for (const t of tris) for (const dd of [0, 1]) for (const u of bins.get(key(t, dd)) || []) {
    if (u.id <= t.id || t.n.dot(u.n) < 0.999 || Math.abs(t.d - u.d) > 0.0015) continue;
    const ov = overlap(t, u);
    if (ov <= 2e-5) continue;
    hits++;
    const p = t.a.clone().add(t.b).add(t.c).multiplyScalar(1 / 3);
    const k = `${p.x.toFixed(2)},${p.y.toFixed(2)},${p.z.toFixed(2)} ${t.mesh}/${u.mesh}`;
    groups[k] = (groups[k] || 0) + ov;
  }
  const top = Object.entries(groups).sort((a, b) => b[1] - a[1]).slice(0, 8);
  out.push(`${name}: ${hits} overlaps${top.map(([k, v]) => `\n   ${k} (${(v * 1e4).toFixed(1)}cm2)`).join('')}`);
}
const list = (k, d) => (q.get(k) ? q.get(k).split(',') : d);
for (const st of list('styles', ['scooter', 'classic', 'express', 'sport', 'enduro', 'cyber'])) for (const bx of list('boxes', ['basic'])) for (const h of list('helmets', ['basic'])) {
  audit(`${st}/${bx}/${h}`, M.createBike(0x8b1e2d, { style: st, box: bx, helmet: h, outfit: q.get('outfit') || 'jacket' }).root);
}
for (const c of list('nat', [])) { const [c1, c2] = nationalLivery(c); audit(`national ${c}`, M.createBike(c1, { style: 'sport', accent: c2, national: true, nationalCode: c, box: 'national', helmet: 'basic', outfit: 'jacket' }).root); }
document.getElementById('out').textContent = out.join('\n');
document.title = 'done';
</script></body></html>
